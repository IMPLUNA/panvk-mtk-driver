
name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PanVK (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-venv python3-pip \
            python3-setuptools python3-wheel \
            ninja-build pkg-config git wget unzip curl \
            clang llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            spirv-tools glslang-tools \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxrandr-dev libdrm-dev libexpat1-dev zlib1g-dev \
            bison flex gettext xsltproc libwayland-dev \
            rustc cargo libclang-rt-18-dev patchelf binutils file

      
      - name: Install compatible Meson
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install "meson==1.4.2"

          MESON="$RUNNER_TEMP/meson-venv/bin/meson"
          VERSION="$("$MESON" --version)"
          echo "Installed Meson version: $VERSION"

          "$RUNNER_TEMP/meson-venv/bin/python" - "$VERSION" <<'PY'
          import re
          import sys

          version = sys.argv[1].strip()
          match = re.match(r"^(\d+)\.(\d+)", version)

          if not match:
              raise SystemExit(f"Cannot parse Meson version: {version}")

          major, minor = map(int, match.groups())

          if (major, minor) < (1, 4):
              raise SystemExit(
                  f"Meson >= 1.4.0 required, got {version}"
              )

          print(f"Meson version check passed: {version}")
          PY

          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify build tools
        shell: bash
        run: |
          set -euxo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version
          meson --version
          patchelf --version
          /usr/lib/llvm-18/bin/clang --version
          git --version

      - name: Build PanVK driver
        shell: bash
        env:
          WORKDIR: ${{ runner.temp }}/panvk-mtk
          NDK_VERSION: r27c
          MESA_FORK_URL: https://github.com/funnymdzz/mesa.git
          MESA_COMMIT: 6598829019c
        run: |
          set -euxo pipefail
          bash ./build.sh "${{ inputs.mode }}"

      - name: Verify output
        shell: bash
        run: |
          set -euxo pipefail
          SO="driver/vulkan.mali.so"
          test -s "$SO"
          file "$SO"
          readelf -h "$SO" > "$RUNNER_TEMP/panvk-elf-header.txt"
          grep -Eq 'Class:[[:space:]]+ELF64' "$RUNNER_TEMP/panvk-elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$RUNNER_TEMP/panvk-elf-header.txt"
          SONAME="$(patchelf --print-soname "$SO")"
          test "$SONAME" = "vulkan.mali.so"
          sha256sum "$SO"

      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-${{ inputs.mode }}-${{ github.sha }}
          path: driver/vulkan.mali.so
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo '## PanVK MTK build succeeded'
            echo
            echo "- Mode: ${{ inputs.mode }}"
            echo '- Mesa commit: 6598829019c'
            echo '- NDK: r27c'
            echo '- Meson: 1.4.2'
            echo '- Output: driver/vulkan.mali.so'
            echo
            echo '### SHA-256'
            echo '```text'
            sha256sum driver/vulkan.mali.so
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
