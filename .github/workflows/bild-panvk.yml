
name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PanVK (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            python3 python3-venv python3-pip \
            python3-setuptools python3-wheel \
            ninja-build pkg-config git wget unzip curl \
            clang llvm-18-dev libclang-18-dev \
            libclang-cpp18-dev libclang-rt-18-dev \
            libclc-18 libclc-18-dev \
            spirv-tools glslang-tools \
            libx11-dev libxext-dev libxdamage-dev \
            libxfixes-dev libxrandr-dev libdrm-dev \
            libexpat1-dev zlib1g-dev \
            bison flex gettext xsltproc libwayland-dev \
            rustc cargo patchelf binutils file

          echo "PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib/llvm-18/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            >> "$GITHUB_ENV"

      - name: Install Python packaging support
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install --user --break-system-packages packaging setuptools wheel

          python3 -c "import packaging, setuptools, wheel; print('System Python packaging:', packaging.__file__)"

      - name: Install compatible Meson
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/meson-venv"

          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install \
            "meson==1.4.2" packaging setuptools wheel

          MESON="$RUNNER_TEMP/meson-venv/bin/meson"
          VERSION="$("$MESON" --version)"

          echo "Installed Meson version: $VERSION"

          "$RUNNER_TEMP/meson-venv/bin/python" - "$VERSION" <<'PY'
          import re
          import sys
          import packaging
          import setuptools
          import wheel

          version = sys.argv[1].strip()
          match = re.match(r"^(\d+)\.(\d+)", version)

          if not match:
              raise SystemExit(f"Cannot parse Meson version: {version}")

          major, minor = map(int, match.groups())

          if (major, minor) < (1, 4):
              raise SystemExit(f"Meson >= 1.4.0 required, got {version}")

          print(f"Meson version check passed: {version}")
          print(f"packaging: {packaging.__file__}")
          print(f"setuptools: {setuptools.__file__}")
          print(f"wheel: {wheel.__file__}")
          PY

          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/lib/llvm-18/bin:$HOME/.cargo/bin:$PATH"
          export LIBCLANG_PATH="/usr/lib/llvm-18/lib"
          export CLANG_PATH="/usr/lib/llvm-18/bin/clang"

          rustc --version
          cargo --version
          rustup target list --installed

          python3 --version
          python3 -c "import packaging, setuptools, wheel"

          meson --version
          ninja --version
          clang --version
          patchelf --version
          git --version

          pkg-config --modversion libclc
          test -x /usr/lib/llvm-18/bin/clang

          echo "Build environment checks passed."

      - name: Build PanVK driver
        shell: bash
        env:
          WORKDIR: ${{ runner.temp }}/panvk-mtk
          NDK_VERSION: r27c
          MESA_FORK_URL: https://github.com/funnymdzz/mesa.git
          MESA_COMMIT: 6598829019c
        run: |
          set -euxo pipefail

          export PATH="/usr/lib/llvm-18/bin:$HOME/.cargo/bin:$PATH"
          export LIBCLANG_PATH="/usr/lib/llvm-18/lib"
          export CLANG_PATH="/usr/lib/llvm-18/bin/clang"

          bash ./build.sh "${{ inputs.mode }}"

      - name: Verify compiled driver
        shell: bash
        run: |
          set -euxo pipefail

          SO="driver/vulkan.mali.so"
          test -s "$SO"

          file "$SO"
          readelf -h "$SO" > "$RUNNER_TEMP/panvk-elf-header.txt"

          grep -Eq 'Class:[[:space:]]+ELF64' \
            "$RUNNER_TEMP/panvk-elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' \
            "$RUNNER_TEMP/panvk-elf-header.txt"

          SONAME="$(patchelf --print-soname "$SO")"
          test "$SONAME" = "vulkan.mali.so"

          sha256sum "$SO"
          echo "Driver verification passed."

      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-${{ inputs.mode }}-${{ github.sha }}
          path: driver/vulkan.mali.so
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo '## PanVK MTK build succeeded'
            echo
            echo "- Mode: ${{ inputs.mode }}"
            echo '- Mesa commit: 6598829019c'
            echo '- NDK: r27c'
            echo '- Meson: 1.4.2'
            echo '- Python packaging dependencies: checked'
            echo '- Output: driver/vulkan.mali.so'
            echo
            echo '### SHA-256'
            echo '```text'
            sha256sum driver/vulkan.mali.so
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
