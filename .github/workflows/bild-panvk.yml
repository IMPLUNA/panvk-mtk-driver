name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PanVK (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      LLVM_VERSION: "18"
      MESA_FORK_URL: https://github.com/funnymdzz/mesa.git
      MESA_COMMIT: 6598829019c
      NDK_VERSION: r27c
      CARGO_HOME: /home/runner/.cargo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            python3 python3-venv python3-pip \
            python3-setuptools python3-wheel \
            ninja-build pkg-config cmake git wget unzip curl \
            clang llvm-18 llvm-18-dev \
            libclang-18-dev libclang-cpp18-dev \
            libclang-rt-18-dev \
            libclc-18 libclc-18-dev \
            libllvmspirvlib-18-dev llvm-spirv-18 \
            spirv-tools glslang-tools \
            libx11-dev libxext-dev libxdamage-dev \
            libxfixes-dev libxrandr-dev libdrm-dev \
            libelf-dev libexpat1-dev zlib1g-dev \
            bison flex gettext xsltproc libwayland-dev \
            rustc cargo patchelf binutils file

      - name: Configure LLVM and Cargo paths
        shell: bash
        run: |
          set -euxo pipefail

          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"

          {
            echo "/usr/lib/llvm-18/bin"
            echo "$CARGO_HOME/bin"
          } >> "$GITHUB_PATH"

          {
            echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib"
            echo "CLANG_PATH=/usr/lib/llvm-18/bin/clang"
            echo "LLVM_CONFIG=/usr/bin/llvm-config-18"
            echo "PKG_CONFIG_PATH=/usr/lib/llvm-18/lib/pkgconfig:/usr/lib/$MULTIARCH/pkgconfig:/usr/lib/pkgconfig"
          } >> "$GITHUB_ENV"

          llvm-config-18 --version
          cmake --version

      - name: Install Python and Meson dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m venv "$RUNNER_TEMP/meson-venv"

          PYTHON="$RUNNER_TEMP/meson-venv/bin/python"
          MESON="$RUNNER_TEMP/meson-venv/bin/meson"

          "$PYTHON" -m pip install --upgrade pip setuptools wheel

          "$PYTHON" -m pip install \
            "meson==1.7.0" \
            packaging \
            "mako>=0.8.0" \
            pyyaml ply six pyparsing Jinja2

          VERSION="$("$MESON" --version)"
          echo "Installed Meson: $VERSION"

          "$PYTHON" - "$VERSION" <<'PY'
          import re
          import sys
          import packaging
          import mako
          import yaml
          import ply
          import jinja2

          version = sys.argv[1].strip()
          match = re.match(r"^(\d+)\.(\d+)", version)

          if not match:
              raise SystemExit(f"Cannot parse Meson version: {version}")

          major, minor = map(int, match.groups())

          if (major, minor) < (1, 7):
              raise SystemExit(
                  f"Mesa requires Meson >= 1.7.0; got {version}"
              )

          print(f"Meson version check passed: {version}")
          print(f"Mako: {mako.__version__}")
          print(f"Packaging: {packaging.__file__}")
          print("Python dependencies verified.")
          PY

          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install bindgen CLI
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$CARGO_HOME/bin"

          cargo install bindgen-cli --locked

          command -v bindgen
          bindgen --version

      - name: Repair missing panvk_drm_stub.c patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="patches/panvk_mtk.patch"

          test -f "$PATCH"

          if ! grep -q \
            '^diff --git a/src/panfrost/vulkan/panvk_drm_stub.c ' \
            "$PATCH"; then

            echo "Adding missing panvk_drm_stub.c source to patch."

            cat >> "$PATCH" <<'PATCH_EOF'

          diff --git a/src/panfrost/vulkan/panvk_drm_stub.c b/src/panfrost/vulkan/panvk_drm_stub.c
          new file mode 100644
          --- /dev/null
          +++ b/src/panfrost/vulkan/panvk_drm_stub.c
          @@ -0,0 +1,12 @@
          +/*
          + * Compatibility stub for Android environments without the expected
          + * libdrm buffer-handle close implementation.
          + */
          +#include <stdint.h>
          +#include <xf86drm.h>
          +
          +int
          +drmCloseBufferHandle(int fd, uint32_t handle)
          +{
          +   (void)fd;
          +   (void)handle;
          +   return 0;
          +}
          PATCH_EOF
          else
            echo "Stub file patch already exists; skipping insertion."
          fi

          echo "=== Verify patch contains stub source ==="
          grep -n -A16 \
            '^diff --git a/src/panfrost/vulkan/panvk_drm_stub.c ' \
            "$PATCH"

      - name: Diagnose LLVM SPIR-V dependencies
        shell: bash
        run: |
          set -euxo pipefail

          llvm-config-18 --version

          dpkg-query -W \
            libllvmspirvlib-18-dev \
            llvm-spirv-18

          dpkg -L libllvmspirvlib-18-dev

          echo "=== SPIR-V pkg-config entries ==="
          pkg-config --list-all | grep -i spirv || true

          echo "=== SPIR-V CMake and pkg-config files ==="
          find /usr/lib /usr/share \
            \( -iname '*LLVMSPIRVLib*' -o -iname '*llvmspirvlib*.pc' \) \
            2>/dev/null || true

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          python3 --version
          python3 -c "import packaging, mako, yaml, ply, jinja2"

          meson --version
          ninja --version
          cmake --version

          rustc --version
          cargo --version
          rustup target list --installed

          bindgen --version
          command -v bindgen

          llvm-config-18 --version
          clang --version
          patchelf --version

          pkg-config --modversion libclc

          test -x /usr/lib/llvm-18/bin/clang

          echo "Build environment checks passed."

      - name: Build PanVK driver
        shell: bash
        run: |
          set -euxo pipefail

          bash ./build.sh "${{ inputs.mode }}"

      - name: Verify compiled driver
        shell: bash
        run: |
          set -euxo pipefail

          SO="driver/vulkan.mali.so"

          test -s "$SO"
          file "$SO"

          readelf -h "$SO" > "$RUNNER_TEMP/panvk-elf-header.txt"

          grep -Eq 'Class:[[:space:]]+ELF64' \
            "$RUNNER_TEMP/panvk-elf-header.txt"

          grep -Eq 'Machine:[[:space:]]+AArch64' \
            "$RUNNER_TEMP/panvk-elf-header.txt"

          SONAME="$(patchelf --print-soname "$SO")"
          test "$SONAME" = "vulkan.mali.so"

          sha256sum "$SO"

      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-${{ inputs.mode }}-${{ github.sha }}
          path: driver/vulkan.mali.so
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo '## PanVK MTK build succeeded'
            echo
            echo "- Mode: ${{ inputs.mode }}"
            echo "- Mesa commit: $MESA_COMMIT"
            echo "- NDK: $NDK_VERSION"
            echo "- Meson: $(meson --version)"
            echo "- bindgen: $(bindgen --version)"
            echo "- Output: driver/vulkan.mali.so"
            echo
            echo '### SHA-256'
            echo '```text'
            sha256sum driver/vulkan.mali.so
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
