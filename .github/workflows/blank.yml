name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-mtk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PanVK MTK Driver - Android 14
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      NDK_VERSION: r27c
      WORKDIR: /home/runner/panvk-mtk
      DEBIAN_FRONTEND: noninteractive

    steps:
      # 1. 获取源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 安装 Rust 和 Android 交叉编译目标
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 4. 安装完整构建依赖
      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            wget \
            curl \
            unzip \
            xz-utils \
            file \
            binutils \
            patchelf \
            cmake \
            ninja-build \
            bison \
            flex \
            gettext \
            xsltproc \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-mako \
            python3-yaml \
            python3-packaging \
            clang-18 \
            llvm-18 \
            llvm-18-dev \
            libclang-18-dev \
            libclang-cpp18-dev \
            libclang-rt-18-dev \
            libclc-18-dev \
            spirv-tools \
            glslang-tools \
            libdrm-dev \
            libexpat1-dev \
            zlib1g-dev \
            libx11-dev \
            libxext-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxrandr-dev \
            libwayland-dev \
            rustc \
            cargo

      # 5. 安装 Meson >= 1.4 和 Ninja
      - name: Install Meson and Ninja
        run: |
          set -euo pipefail

          python -m pip install --upgrade \
            "meson>=1.4" \
            ninja \
            packaging \
            mako

          export PATH="$(python -m site --user-base)/bin:$PATH"

          echo "=== Meson ==="
          meson --version

          python -c '
          from packaging.version import Version
          import subprocess

          version = Version(
              subprocess.check_output(
                  ["meson", "--version"], text=True
              ).strip()
          )

          print("Detected Meson:", version)
          assert version >= Version("1.4"), \
              "Meson 1.4 or newer is required"
          '

          echo "=== Ninja ==="
          ninja --version

      # 6. 检查 libclc 和 LLVM
      - name: Verify LLVM and libclc
        run: |
          set -euo pipefail

          echo "=== LLVM ==="
          llvm-config-18 --version

          echo "=== Clang ==="
          /usr/bin/clang-18 --version

          echo "=== libclc package ==="
          dpkg-query -W \
            libclc-18 \
            libclc-18-dev

          echo "=== libclc files ==="
          dpkg -L libclc-18-dev

          echo "=== SPIR-V tools ==="
          command -v spirv-as
          command -v spirv-val

          echo "=== Rust ==="
          rustc --version
          cargo --version

      # 7. 检查仓库文件
      - name: Validate source tree
        run: |
          set -euo pipefail

          test -f build.sh
          test -f patches/panvk_mtk.patch

          echo "=== Repository ==="
          git log -1 --oneline

          echo "=== Build script ==="
          sed -n '1,180p' build.sh

      # 8. 编译
      - name: Build driver
        env:
          BUILD_MODE: ${{ inputs.mode }}
          PATH: /usr/lib/llvm-18/bin:/home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail

          mkdir -p "$WORKDIR"

          chmod +x ./build.sh

          set -o pipefail
          bash ./build.sh "$BUILD_MODE" \
            2>&1 | tee build.log

      # 9. 检查产物
      - name: Verify driver
        if: success()
        run: |
          set -euo pipefail

          DRIVER="driver/vulkan.mali.so"

          if [ ! -s "$DRIVER" ]; then
            echo "::error::Expected driver not found: $DRIVER"
            find driver -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "=== ELF information ==="
          file "$DRIVER"
          readelf -h "$DRIVER"

          echo "=== Dynamic dependencies ==="
          readelf -d "$DRIVER" || true

          echo "=== SHA256 ==="
          sha256sum "$DRIVER" | tee SHA256SUMS.txt

          mkdir -p artifacts
          cp "$DRIVER" artifacts/vulkan.mali.so
          cp SHA256SUMS.txt artifacts/

      # 10. 上传产物和日志
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-api34-${{ inputs.mode }}
          path: |
            artifacts/
            build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
