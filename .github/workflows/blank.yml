name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-mtk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PanVK MTK Driver - Android 14
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      NDK_VERSION: r27c
      DEBIAN_FRONTEND: noninteractive
      LLVM_CONFIG: /usr/bin/llvm-config-18
      PKG_CONFIG_PATH: /usr/lib/llvm-18/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig
      CMAKE_PREFIX_PATH: /usr/lib/llvm-18
      CARGO_HOME: /home/runner/.cargo
      PATH: /home/runner/.cargo/bin:/usr/lib/llvm-18/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential pkg-config git wget curl unzip xz-utils \
            file binutils patchelf cmake ninja-build bison flex gettext \
            xsltproc python3 python3-pip python3-setuptools python3-wheel \
            python3-mako python3-yaml python3-packaging \
            clang-18 llvm-18 llvm-18-dev \
            libclang-18-dev libclang-cpp18-dev libclang-rt-18-dev \
            libclc-18-dev \
            llvm-spirv-18 libllvmspirvlib-18-dev \
            spirv-tools glslang-tools \
            libdrm-dev libexpat1-dev zlib1g-dev \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxrandr-dev libwayland-dev

      - name: Install Python build dependencies
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            "meson>=1.4" ninja packaging mako PyYAML

          echo "=== Python ==="
          python --version
          python -c 'import sys; print(sys.executable)'
          python -c 'import yaml; print("PyYAML:", yaml.__version__)'

          echo "=== Meson ==="
          meson --version

          python -c '
          from packaging.version import Version
          import subprocess

          version = Version(subprocess.check_output(
              ["meson", "--version"], text=True
          ).strip())

          print("Detected Meson:", version)
          assert version >= Version("1.4"), \
              "Meson 1.4 or newer is required"
          '

          echo "=== Ninja ==="
          ninja --version

      - name: Install bindgen CLI
        run: |
          set -euxo pipefail

          cargo install bindgen-cli --locked

          command -v bindgen
          bindgen --version

      - name: Verify LLVM and SPIR-V dependencies
        run: |
          set -euxo pipefail

          echo "=== LLVM ==="
          llvm-config-18 --version
          clang-18 --version

          echo "=== libclc ==="
          dpkg-query -W -f='${Package} ${Version}\n' libclc-18-dev

          echo "=== SPIR-V translator ==="
          dpkg-query -W -f='${Package} ${Version}\n' \
            llvm-spirv-18 libllvmspirvlib-18-dev
          command -v llvm-spirv-18
          llvm-spirv-18 --version || true

          echo "=== SPIR-V tools ==="
          command -v spirv-as
          command -v spirv-val

          echo "=== Rust and bindgen ==="
          rustc --version
          cargo --version
          bindgen --version

      - name: Validate repository
        run: |
          set -euxo pipefail

          test -f build.sh
          test -f patches/panvk_mtk.patch

          echo "=== Repository commit ==="
          git log -1 --oneline

          echo "=== Build script ==="
          sed -n '45,100p' build.sh

          echo "=== Existing stub references ==="
          grep -n 'panvk_drm_stub.c' \
            patches/panvk_mtk.patch

      - name: Repair incomplete Mesa patch
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path

          patch_path = Path("patches/panvk_mtk.patch")
          patch = patch_path.read_text()

          source = "src/panfrost/vulkan/panvk_drm_stub.c"
          diff_header = f"diff --git a/{source} b/{source}"

          if diff_header in patch:
              print("Stub source already exists in the patch.")
          else:
              reference = "'panvk_drm_stub.c',"

              if reference not in patch:
                  raise SystemExit(
                      "Expected panvk_drm_stub.c reference "
                      "was not found; refusing to modify the patch."
                  )

              new_file_patch = r"""
          diff --git a/src/panfrost/vulkan/panvk_drm_stub.c b/src/panfrost/vulkan/panvk_drm_stub.c
          new file mode 100644
          --- /dev/null
          +++ b/src/panfrost/vulkan/panvk_drm_stub.c
          @@ -0,0 +1,10 @@
          +#include <errno.h>
          +#include <stdint.h>
          +#include <xf86drm.h>
          +
          +int drmCloseBufferHandle(int fd, uint32_t handle)
          +{
          +   (void)fd;
          +   (void)handle;
          +   return -ENOSYS;
          +}
          """

              patch_path.write_text(
                  patch.rstrip() + "\n\n" + new_file_patch.lstrip("\n")
              )

              print("Added missing DRM stub source to Mesa patch.")

          updated = patch_path.read_text()

          if diff_header not in updated:
              raise SystemExit("DRM stub patch insertion failed.")

          print("=== Verify patch definition ===")
          print(updated[updated.index(diff_header):])
          PY

      - name: Build driver
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          set -euxo pipefail

          chmod +x ./build.sh

          bash ./build.sh "$BUILD_MODE" \
            2>&1 | tee build.log

      - name: Verify build output
        if: success()
        run: |
          set -euxo pipefail

          SO="driver/vulkan.mali.so"

          if [ ! -s "$SO" ]; then
            echo "::error::Driver output is missing or empty: $SO"
            exit 1
          fi

          echo "=== File information ==="
          file "$SO"

          echo "=== ELF header ==="
          readelf -h "$SO"

          echo "=== SHA256 ==="
          sha256sum "$SO" | tee SHA256SUMS.txt

          mkdir -p artifacts
          cp "$SO" artifacts/
          cp SHA256SUMS.txt artifacts/

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-api34-${{ inputs.mode }}
          path: |
            artifacts/
            build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
