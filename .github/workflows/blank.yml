name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-mtk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PanVK MTK Driver - Android 14
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      NDK_VERSION: r27c
      DEBIAN_FRONTEND: noninteractive
      LLVM_CONFIG: /usr/bin/llvm-config-18
      PKG_CONFIG_PATH: /usr/lib/llvm-18/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig
      CMAKE_PREFIX_PATH: /usr/lib/llvm-18
      CARGO_HOME: /home/runner/.cargo
      PATH: /home/runner/.cargo/bin:/usr/lib/llvm-18/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install system dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential pkg-config git wget curl unzip xz-utils \
            file binutils patchelf cmake ninja-build bison flex gettext \
            xsltproc python3 python3-pip python3-setuptools python3-wheel \
            python3-mako python3-yaml python3-packaging \
            clang-18 llvm-18 llvm-18-dev \
            libclang-18-dev libclang-cpp18-dev libclang-rt-18-dev \
            libclc-18-dev \
            llvm-spirv-18 libllvmspirvlib-18-dev \
            spirv-tools glslang-tools \
            libdrm-dev libexpat1-dev zlib1g-dev \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxrandr-dev libwayland-dev

      - name: Install Python build dependencies
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            "meson>=1.4" ninja packaging mako PyYAML

          echo "=== Python ==="
          python --version
          python -c 'import sys; print(sys.executable)'
          python -c 'import yaml; print("PyYAML:", yaml.__version__)'

          echo "=== Meson ==="
          meson --version

          python -c '
          from packaging.version import Version
          import subprocess

          version = Version(subprocess.check_output(
              ["meson", "--version"], text=True
          ).strip())

          print("Detected Meson:", version)
          assert version >= Version("1.4"), \
              "Meson 1.4 or newer is required"
          '

          echo "=== Ninja ==="
          ninja --version

      - name: Install bindgen CLI
        run: |
          set -euxo pipefail

          cargo install bindgen-cli --locked

          echo "=== Verify bindgen ==="
          command -v bindgen
          bindgen --version

      - name: Verify LLVM, libclc and SPIR-V translator
        run: |
          set -euxo pipefail

          echo "=== LLVM ==="
          llvm-config-18 --version
          clang-18 --version

          echo "=== libclc ==="
          dpkg-query -W -f='${Package} ${Version}\n' \
            libclc-18-dev
          dpkg -L libclc-18-dev

          echo "=== SPIR-V translator packages ==="
          dpkg-query -W -f='${Package} ${Version}\n' \
            llvm-spirv-18 libllvmspirvlib-18-dev

          echo "=== SPIR-V translator executable ==="
          command -v llvm-spirv-18
          llvm-spirv-18 --version || true

          echo "=== SPIR-V library metadata ==="
          dpkg -L libllvmspirvlib-18-dev

          find /usr -type f \
            \( -iname '*LLVMSPIRVLib*Config.cmake' \
               -o -iname '*LLVMSPIRVLib*.cmake' \
               -o -iname '*LLVMSPIRVLib*.pc' \) \
            -print 2>/dev/null || true

          echo "=== SPIR-V tools ==="
          command -v spirv-as
          command -v spirv-val

          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo "=== bindgen ==="
          command -v bindgen
          bindgen --version

      - name: Validate source tree
        run: |
          set -euo pipefail

          test -f build.sh

          echo "=== Repository ==="
          git log -1 --oneline

          echo "=== Build script ==="
          sed -n '1,260p' build.sh

      - name: Build driver
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          chmod +x ./build.sh

          bash ./build.sh "$BUILD_MODE" \
            2>&1 | tee build.log

      - name: Locate and verify build artifacts
        if: success()
        run: |
          set -euo pipefail

          echo "=== Shared libraries ==="
          find . -type f -name '*.so' \
            -not -path './.git/*' -print

          echo "=== Archives ==="
          find . -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tar.xz' \) \
            -not -path './.git/*' -print

          mkdir -p artifacts

          find . -type f \
            \( -name '*.so' -o -name '*.zip' \
               -o -name '*.tar.gz' -o -name '*.tar.xz' \) \
            -not -path './.git/*' \
            -not -path './artifacts/*' \
            -exec cp --parents '{}' artifacts/ \;

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "::error::No build artifacts found"
            exit 1
          fi

          echo "=== ELF information ==="
          find artifacts -type f -name '*.so' \
            -exec file '{}' \;

          echo "=== SHA256 ==="
          find artifacts -type f \
            -exec sha256sum '{}' \; | tee SHA256SUMS.txt

          cp SHA256SUMS.txt artifacts/

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-api34-${{ inputs.mode }}
          path: |
            artifacts/
            build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
