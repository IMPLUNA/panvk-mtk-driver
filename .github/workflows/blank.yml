name: Build PanVK MTK Driver

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: panvk-mtk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android Vulkan Driver (API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson, Ninja and dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --upgrade "meson>=1.4" ninja packaging

          echo "=== Meson version ==="
          meson --version

          python -c \
            'from packaging.version import Version; import subprocess; v=Version(subprocess.check_output(["meson", "--version"], text=True).strip()); print("Meson:", v); assert v >= Version("1.4"), "Meson >= 1.4 required"'

          echo "=== Ninja version ==="
          ninja --version

          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            file \
            binutils \
            build-essential \
            pkg-config \
            cmake \
            git \
            curl \
            unzip \
            xz-utils

      - name: Check repository build files
        run: |
          set -euo pipefail

          test -f build.sh || {
            echo "::error::build.sh not found in repository root"
            exit 1
          }

          echo "=== Repository root ==="
          ls -la

          echo "=== Build script ==="
          sed -n '1,240p' build.sh

      - name: Build driver
        env:
          NDK_VERSION: r27c
        run: |
          set -euo pipefail

          chmod +x ./build.sh

          bash ./build.sh "${{ inputs.mode }}" \
            2>&1 | tee build.log

      - name: Locate and verify build artifacts
        if: success()
        run: |
          set -euo pipefail

          echo "=== Candidate shared libraries ==="
          find . -type f -name '*.so' \
            -not -path './.git/*' -print

          echo "=== Candidate archives ==="
          find . -type f \( \
            -name '*.zip' -o \
            -name '*.tar.gz' -o \
            -name '*.tar.xz' \
          \) -not -path './.git/*' -print

          mkdir -p artifacts

          # 收集构建产生的文件，避免假定固定输出目录
          find . -type f \( \
            -name '*.so' -o \
            -name '*.zip' -o \
            -name '*.tar.gz' -o \
            -name '*.tar.xz' \
          \) \
            -not -path './.git/*' \
            -not -path './artifacts/*' \
            -exec cp --parents '{}' artifacts/ \;

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "::error::No build artifacts found"
            exit 1
          fi

          echo "=== Artifact file information ==="
          find artifacts -type f -name '*.so' \
            -exec file '{}' \;

          echo "=== SHA256 ==="
          find artifacts -type f -exec sha256sum '{}' \; \
            | tee SHA256SUMS.txt

          cp SHA256SUMS.txt artifacts/

      - name: Upload build artifacts
        if: always() && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mtk-api34-${{ inputs.mode }}
          path: |
            artifacts/
            build.log
            SHA256SUMS.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
